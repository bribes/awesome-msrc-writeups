name: Build and validate catalog

on:
  pull_request:
    paths:
      - writeups.csv
      - README.md
      - CONTRIBUTING.md
      - infra/builder/**
      - .github/workflows/agvrpw-builder.yml
  push:
    branches:
      - master
    paths:
      - writeups.csv
      - README.md
      - CONTRIBUTING.md
      - infra/builder/**
      - .github/workflows/agvrpw-builder.yml
  workflow_dispatch:

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate catalog and test generation
        run: python infra/builder/csv_to_readme.py writeups.csv README.generated.md
      - name: Verify generated README is current
        run: cmp README.md README.generated.md
      - name: Check whitespace errors
        run: git diff --check

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Generate README
        run: python infra/builder/csv_to_readme.py writeups.csv README.md
      - name: Commit generated README when needed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Build writeups"
          git push
